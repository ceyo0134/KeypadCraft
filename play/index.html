<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KeypadCraft - play in your browser</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none;image-rendering:pixelated}
</style></head><body>
<canvas id="c"></canvas>
<script>
/* KeypadCraft - web port of Blocks J2ME. 1:1 port of BlocksCanvas.java (same world gen, same
   isometric renderer, same texture scaling, same toolbar/help/controls).
   Based on the game Blocks-TI-84 by TheScienceElf (MIT). J2ME + web port (c) 2026 Ceyo (MIT).
   Block textures: Minecraft-style art, (c) Mojang / Microsoft. Unofficial fan project. */
(function () {
"use strict";
var AIR=0,WATER=1,STONE=2,GRASS=3,DIRT=4,PLANKS=6,WOOD=9,LEAVES=10,SAND=11,COAL_ORE=20,IRON_ORE=21,BEDROCK=22,GOLD=24;
var COLOR=[0,0x3050E0,0x808080,0x4CAF30,0x8B5A2B,0x6E6E6E,0xB8864B,0xA04030,0xD0D0D0,0x5C4020,0x2E8B2E,0xE0D090,0x7A5230,0xD02020,0x9A6A3A,0x555555,0x6B3A2A,0xDDDD44,0x999080,0x3F7F3F,0x404040,0xB09080,0x202020,0xDCDCDC,0xFFD700];
var N=48,H=16,WATER_LEVEL=5,GRID_STEP=8,GRID_SIZE=N/GRID_STEP+1;
var BAR=30;
var TEX=["water","stone","grass","dirt","cobblestone","planks","bricks","slabs","wood","leaves","sand","bookshelf","tnt","crafting_table","furnace","jukebox","sponge","gravel","moss","coal_ore","iron_ore","bedrock","iron_block","gold_block"];
var HELP=["BLOCKS J2ME - HELP","","TOUCHSCREEN:","Tap a block: place next","  to it","Drag: move the map","- + : zoom out / in","< > : change block","Put/Del: switch mode","? : open this help","","KEYPAD PHONE:","D-pad / 2 4 6 8:","  move the map","5 or OK: place/remove","  at the red crosshair","1: zoom out  3: zoom in","7: prev  9: next block","*: Put/Del mode","0: next block","#: open/close help","","Next: press any key/tap"];

var cv=document.getElementById("c"), g=cv.getContext("2d");
var W=0,Hh=0,dpr=1;
function getWidth(){return W} function getHeight(){return Hh}

/* ---------- state ---------- */
var blocks=new Uint8Array(H*N*N);
var cur=STONE;
var lZoomOut="-",lZoomIn="+",lPrev="<",lNext=">",lPut="Put",lDel="Del",lHelp="?";
var helpText=HELP, lang={};
var src=new Array(24), tiles=null;
var hw=16,hh=8,bh=16,ox=0,oy=0;
var inited=false,removeMode=false,keyMode=false,help=true,helpPage=0;
var downX=0,downY=0,lastX=0,lastY=0,dragged=false;
var hx=0,hy=0,hz=0,hface=-1;

/* ---------- lang.txt (same parser as loadLang) ---------- */
function parseLang(txt){
  if(txt.length>0&&txt.charCodeAt(0)===0xFEFF)txt=txt.substring(1);
  var p=0,len=txt.length;
  while(p<len){
    var e=txt.indexOf("\n",p); if(e<0)e=len;
    var line=txt.substring(p,e); p=e+1;
    if(line.length>0&&line.charAt(line.length-1)==="\r")line=line.substring(0,line.length-1);
    if(line.length===0||line.charAt(0)==="#")continue;
    var eq=line.indexOf("="); if(eq<=0)continue;
    lang[line.substring(0,eq).trim()]=line.substring(eq+1);
  }
}
function t(k,d){return Object.prototype.hasOwnProperty.call(lang,k)?lang[k]:d}
function applyLang(){
  lZoomOut=t("btn.zoomout",lZoomOut);lZoomIn=t("btn.zoomin",lZoomIn);
  lPrev=t("btn.prev",lPrev);lNext=t("btn.next",lNext);
  lPut=t("btn.put",lPut);lDel=t("btn.del",lDel);lHelp=t("btn.help",lHelp);
  var v=[];
  for(var i=1;i<200;i++){var o=lang["help."+i]; if(o===undefined)break; v.push(o);}
  helpText=v.length>0?v:HELP;
}

/* ---------- world ---------- */
function get(x,y,z){ if(x<0||y<0||z<0||x>=N||y>=H||z>=N)return AIR; return blocks[(y*N+x)*N+z]; }
function set(x,y,z,b){ if(x<0||y<0||z<0||x>=N||y>=H||z>=N)return; blocks[(y*N+x)*N+z]=b; }
function fill(x0,y0,z0,x1,y1,z1,b){
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++)for(var z=z0;z<=z1;z++)set(x,y,z,b);
}
function rnd(n){return Math.floor(Math.random()*n)}
function randInt(a,b){return a+rnd(b-a+1)}
function addTree(tx,ty,tz){
  fill(tx-2,ty+3,tz-2,tx+2,ty+4,tz+2,LEAVES);
  fill(tx-1,ty+5,tz-1,tx+1,ty+5,tz+1,LEAVES);
  set(tx+1,ty+6,tz,LEAVES);set(tx-1,ty+6,tz,LEAVES);
  set(tx,ty+6,tz+1,LEAVES);set(tx,ty+6,tz-1,LEAVES);
  set(tx,ty+6,tz,LEAVES);
  fill(tx,ty,tz,tx,ty+5,tz,WOOD);
}
function generateNatural(){
  fill(0,0,0,N-1,0,N-1,BEDROCK);
  fill(0,1,0,N-1,WATER_LEVEL,N-1,WATER);
  var grid=[],x,z;
  for(x=0;x<GRID_SIZE;x++){grid.push([]);for(z=0;z<GRID_SIZE;z++)grid[x].push(randInt(3,12));}
  for(x=0;x<N;x++){
    for(z=0;z<N;z++){
      var gx=Math.floor(x/GRID_STEP),gz=Math.floor(z/GRID_STEP);
      var lx=x-gx*GRID_STEP,lz=z-gz*GRID_STEP;
      var h=grid[gx][gz]*(GRID_STEP-lx)*(GRID_STEP-lz)
          +grid[gx+1][gz]*lx*(GRID_STEP-lz)
          +grid[gx][gz+1]*(GRID_STEP-lx)*lz
          +grid[gx+1][gz+1]*lx*lz;
      h=Math.floor(h/(GRID_STEP*GRID_STEP));
      if(h>3){fill(x,1,z,x,h-3,z,STONE);fill(x,h-2,z,x,h,z,DIRT);}
      else fill(x,1,z,x,h,z,DIRT);
      if(h>=WATER_LEVEL)fill(x,h,z,x,h,z,GRASS);
    }
  }
  for(var y=WATER_LEVEL-1;y<=WATER_LEVEL;y++)
    for(x=0;x<N;x++)for(z=0;z<N;z++){
      var b=get(x,y,z);
      if(b!==GRASS&&b!==DIRT)continue;
      var up=get(x,y+1,z);
      if(up!==AIR&&up!==WATER)continue;
      var near=false;
      for(var by=-1;by<=1&&!near;by++)
        for(var bx=-2;bx<=2&&!near;bx++)
          for(var bz=-2;bz<=2;bz++)
            if(get(x+bx,y+by,z+bz)===WATER){near=true;break;}
      if(near)set(x,y,z,SAND);
    }
  for(var i=0;i<12;i++){
    var tx=2+rnd(N-1-4),tz=2+rnd(N-1-4),ty=H-8;
    if(get(tx,ty+1,tz)!==AIR)continue;
    while(ty>0&&get(tx,ty,tz)===AIR)ty--;
    if(get(tx,ty,tz)!==GRASS)continue;
    addTree(tx,ty+1,tz);
    set(tx,ty,tz,DIRT);
  }
  for(var yy=1;yy<H;yy++)
    for(x=0;x<N;x++)for(z=0;z<N;z++){
      if(get(x,yy,z)!==STONE)continue;
      var r=randInt(0,19);
      if(r===0)set(x,yy,z,COAL_ORE);else if(r===1)set(x,yy,z,IRON_ORE);
    }
}

/* ---------- textures (same nearest-neighbour scaling as buildTiles) ---------- */
function buildTiles(){
  tiles=null;
  var tw=hw*2, th=Math.floor(31*hw/16);
  var t=new Array(24);
  for(var b=0;b<24;b++){
    var im=src[b]; if(!im)continue;
    var sw=im.width,sh=im.height;
    var out=document.createElement("canvas"); out.width=tw; out.height=th;
    var oc=out.getContext("2d");
    try{
      var sc=document.createElement("canvas"); sc.width=sw; sc.height=sh;
      var sx=sc.getContext("2d"); sx.drawImage(im,0,0);
      var sp=sx.getImageData(0,0,sw,sh).data;
      var od=oc.createImageData(tw,th), d=od.data;
      for(var y=0;y<th;y++){
        var sy=Math.floor(y*sh/th);
        for(var x=0;x<tw;x++){
          var s=(sy*sw+Math.floor(x*sw/tw))*4,o=(y*tw+x)*4;
          d[o]=sp[s];d[o+1]=sp[s+1];d[o+2]=sp[s+2];d[o+3]=sp[s+3];
        }
      }
      oc.putImageData(od,0,0);
    }catch(e){ oc.imageSmoothingEnabled=false; oc.drawImage(im,0,0,tw,th); }
    t[b]=out;
  }
  tiles=t;
}

/* ---------- drawing helpers (java.awt-like, pixel exact) ---------- */
function css(c){var s=c.toString(16);while(s.length<6)s="0"+s;return "#"+s}
function shade(c,pct){
  var r=Math.floor(((c>>16)&255)*pct/100),gg=Math.floor(((c>>8)&255)*pct/100),b=Math.floor((c&255)*pct/100);
  return (r<<16)|(gg<<8)|b;
}
function setColor(c){g.fillStyle=css(c)}
function fillRect(x,y,w,h){g.fillRect(x,y,w,h)}
function drawRect(x,y,w,h){ g.fillRect(x,y,w+1,1);g.fillRect(x,y+h,w+1,1);g.fillRect(x,y,1,h+1);g.fillRect(x+w,y,1,h+1); }
function fillTriangle(x1,y1,x2,y2,x3,y3){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.closePath();g.fill()}
function drawString(s,x,y,hcenter){
  g.fillStyle=g.fillStyle; g.textBaseline="top"; g.textAlign=hcenter?"center":"left"; g.fillText(s,x,y);
}
function vis(b,nb){ if(nb===AIR)return true; if(nb===WATER)return b!==WATER; return false; }

/* draw (draw=true) the whole world, or find the front-most face at (tx,ty) */
function scan(draw,tx,ty){
  var w=getWidth(),h=getHeight();
  hface=-1;
  for(var x=0;x<N;x++){
    for(var z=0;z<N;z++){
      var sx=ox+(x-z)*hw;
      if(draw){ if(sx<-hw||sx>w+hw)continue; }
      else if(Math.abs(tx-sx)>hw)continue;
      for(var y=0;y<H;y++){
        var b=get(x,y,z);
        if(b===AIR)continue;
        var sy=oy+(x+z)*hh-y*bh;
        if(draw){ if(sy+hh+bh<0||sy-hh>h)continue; }
        else if(ty<sy-hh||ty>sy+hh+bh)continue;
        var top=vis(b,get(x,y+1,z)), left=vis(b,get(x,y,z+1)), right=vis(b,get(x+1,y,z));
        if(draw){
          if(tiles!==null&&tiles[b-1]){
            if(top||left||right)g.drawImage(tiles[b-1],sx-hw,sy-hh);
            continue;
          }
          var c=COLOR[b];
          if(top){
            setColor(c);
            fillTriangle(sx,sy-hh,sx+hw,sy,sx,sy+hh);
            fillTriangle(sx,sy-hh,sx-hw,sy,sx,sy+hh);
          }
          if(left){
            setColor(shade(c,75));
            fillTriangle(sx-hw,sy,sx,sy+hh,sx,sy+hh+bh);
            fillTriangle(sx-hw,sy,sx-hw,sy+bh,sx,sy+hh+bh);
          }
          if(right){
            setColor(shade(c,55));
            fillTriangle(sx,sy+hh,sx+hw,sy,sx+hw,sy+bh);
            fillTriangle(sx,sy+hh,sx,sy+hh+bh,sx+hw,sy+bh);
          }
        }else{
          var f=-1;
          if(top&&Math.abs(tx-sx)*hh+Math.abs(ty-sy)*hw<=hw*hh)f=0;
          if(left&&tx>=sx-hw&&tx<sx){
            var tt=sy+Math.floor((tx-(sx-hw))*hh/hw);
            if(ty>=tt&&ty<=tt+bh)f=1;
          }
          if(right&&tx>=sx&&tx<=sx+hw){
            var t2=sy+hh-Math.floor((tx-sx)*hh/hw);
            if(ty>=t2&&ty<=t2+bh)f=2;
          }
          if(f>=0){hx=x;hy=y;hz=z;hface=f;}
        }
      }
    }
  }
}

function paint(){
  var w=getWidth(),h=getHeight();
  g.setTransform(dpr,0,0,dpr,0,0);
  g.imageSmoothingEnabled=false;
  if(!inited){inited=true;buildTiles();ox=Math.floor(w/2);oy=Math.floor((h-BAR)/2)-N*hh+6*bh;}
  setColor(0x87CEEB); fillRect(0,0,w,h);
  scan(true,0,0);
  if(keyMode&&!help){
    var cx=Math.floor(w/2),cy=Math.floor((h-BAR)/2);
    setColor(0xFF0000);
    fillRect(cx-6,cy,13,1); fillRect(cx,cy-6,1,13);
  }
  setColor(0x202020); fillRect(0,h-BAR,w,BAR);
  setColor(0xFFFFFF);
  var cw=Math.floor(w/7), ty=h-BAR+Math.floor((BAR-12)/2);
  var lab=[lZoomOut,lZoomIn,lPrev,"",lNext,removeMode?lDel:lPut,lHelp];
  g.font="14px sans-serif";
  for(var i=0;i<7;i++){
    drawRect(i*cw+1,h-BAR+1,cw-2,BAR-2);
    if(lab[i].length>0)drawString(lab[i],i*cw+Math.floor(cw/2),ty,true);
  }
  setColor(COLOR[cur]);
  fillRect(3*cw+Math.floor(cw/2)-7,h-BAR+Math.floor((BAR-14)/2),14,14);
  if(help)paintHelp(g,w,h);
}
function perPage(){var per=Math.floor((getHeight()-12)/13); return per<4?4:per}
function paintHelp(g,w,h){
  var fh=13,per=perPage();
  setColor(0x101820); fillRect(2,2,w-4,h-4);
  setColor(0xFFFFFF); drawRect(2,2,w-5,h-5);
  g.font="12px sans-serif";
  var start=helpPage*per;
  for(var i=0;i<per&&start+i<helpText.length;i++)drawString(helpText[start+i],8,6+i*fh,false);
}
function nextHelp(){
  helpPage++;
  if(helpPage*perPage()>=helpText.length){help=false;helpPage=0;}
  repaint();
}
function openHelp(){help=true;helpPage=0;repaint()}

/* ---------- actions ---------- */
function tapAt(x,y){
  scan(false,x,y);
  if(hface<0)return;
  if(removeMode){
    if(get(hx,hy,hz)!==BEDROCK)set(hx,hy,hz,AIR);
  }else{
    var nx=hx,ny=hy,nz=hz;
    if(hface===0)ny++;else if(hface===1)nz++;else nx++;
    if(nx<N&&ny<H&&nz<N){
      var tt=get(nx,ny,nz);
      if(tt===AIR||tt===WATER)set(nx,ny,nz,cur);
    }
  }
  repaint();
}
function nextBlock(d){cur+=d;if(cur>GOLD)cur=WATER;if(cur<WATER)cur=GOLD;}
function trunc(v){return v<0?Math.ceil(v):Math.floor(v)}
function zoom(d){
  var nhw=hw+d;
  if(nhw<4||nhw>16)return;
  var cx=Math.floor(getWidth()/2),cy=Math.floor((getHeight()-BAR)/2);
  ox=cx+trunc((ox-cx)*nhw/hw);
  oy=cy+trunc((oy-cy)*nhw/hw);
  hw=nhw;hh=Math.floor(nhw/2);bh=nhw;
  buildTiles();
}

/* ---------- pointer (touch + mouse) ---------- */
function pointerPressed(x,y){keyMode=false;downX=lastX=x;downY=lastY=y;dragged=false;}
function pointerDragged(x,y){
  if(help||downY>=getHeight()-BAR)return;
  if(!dragged&&Math.abs(x-downX)+Math.abs(y-downY)<6)return;
  dragged=true;
  ox+=x-lastX;oy+=y-lastY;
  lastX=x;lastY=y;
  repaint();
}
function pointerReleased(x,y){
  if(help){nextHelp();return;}
  if(dragged)return;
  var w=getWidth(),h=getHeight();
  if(y>=h-BAR){
    var cell=Math.floor(x*7/w);
    if(cell===0)zoom(-2);
    else if(cell===1)zoom(2);
    else if(cell===2)nextBlock(-1);
    else if(cell===3||cell===4)nextBlock(1);
    else if(cell===5)removeMode=!removeMode;
    else{openHelp();return;}
    repaint();
    return;
  }
  tapAt(x,y);
}
var activeId=null;
function pos(e){var r=cv.getBoundingClientRect();return [Math.floor(e.clientX-r.left),Math.floor(e.clientY-r.top)]}
cv.addEventListener("pointerdown",function(e){
  if(activeId!==null||(e.pointerType==="mouse"&&e.button!==0))return;
  activeId=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(x){}
  var p=pos(e);pointerPressed(p[0],p[1]);e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(e.pointerId!==activeId)return;var p=pos(e);pointerDragged(p[0],p[1]);
});
function up(e){
  if(e.pointerId!==activeId)return;activeId=null;
  if(e.type==="pointerup"){var p=pos(e);pointerReleased(p[0],p[1]);}
}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
/* extra for desktop: mouse wheel = zoom buttons */
var wheelAt=0;
cv.addEventListener("wheel",function(e){
  e.preventDefault();var n=Date.now();if(n-wheelAt<60)return;wheelAt=n;
  if(help)return;zoom(e.deltaY<0?2:-2);repaint();
},{passive:false});

/* ---------- keyboard (same mapping as keyPressed/keyRepeated) ---------- */
function mapKey(e){
  var k=e.key;
  switch(k){
    case "ArrowUp":case "w":case "W":return{a:"UP"};
    case "ArrowDown":case "s":case "S":return{a:"DOWN"};
    case "ArrowLeft":case "a":case "A":return{a:"LEFT"};
    case "ArrowRight":case "d":case "D":return{a:"RIGHT"};
    case "Enter":case " ":return{a:"FIRE"};
    case "*":return{n:"STAR"};
    case "#":case "h":case "H":case "?":return{n:"POUND"};
  }
  if(k.length===1&&k>="0"&&k<="9")return{n:k};
  return null;
}
function keyPressed(m){
  if(help){nextHelp();return;}
  keyMode=true;
  var step=8,a=m.a,n=m.n;
  if(a==="UP"||n==="2")oy+=step;
  else if(a==="DOWN"||n==="8")oy-=step;
  else if(a==="LEFT"||n==="4")ox+=step;
  else if(a==="RIGHT"||n==="6")ox-=step;
  else if(a==="FIRE"||n==="5"){tapAt(Math.floor(getWidth()/2),Math.floor((getHeight()-BAR)/2));return;}
  else if(n==="1")zoom(-2);
  else if(n==="3")zoom(2);
  else if(n==="7")nextBlock(-1);
  else if(n==="9"||n==="0")nextBlock(1);
  else if(n==="STAR")removeMode=!removeMode;
  else if(n==="POUND"){openHelp();return;}
  else return;
  repaint();
}
function keyRepeated(m){
  var a=m.a,n=m.n;
  if(!help&&(a==="UP"||a==="DOWN"||a==="LEFT"||a==="RIGHT"||n==="2"||n==="4"||n==="6"||n==="8"))keyPressed(m);
}
addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var m=mapKey(e);
  if(e.key==="Shift"||e.key==="Control"||e.key==="Alt"||e.key==="Meta"||e.key==="CapsLock")return;
  if(help&&!e.repeat&&!m){nextHelp();e.preventDefault();return;}
  if(!m)return;
  e.preventDefault();
  if(e.repeat)keyRepeated(m);else keyPressed(m);
});

/* ---------- paint scheduling / resize ---------- */
var pending=false;
function repaint(){ if(pending)return; pending=true; requestAnimationFrame(function(){pending=false;paint();}); }
function resize(){
  dpr=window.devicePixelRatio||1;
  W=Math.floor(innerWidth);Hh=Math.floor(innerHeight);
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(Hh*dpr);
  cv.style.width=W+"px";cv.style.height=Hh+"px";
  repaint();
}
addEventListener("resize",resize);

/* ---------- start: load textures + lang.txt, then generate and show ---------- */
function loadImg(name){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){res(im)};im.onerror=function(){res(null)};
    im.src="textures/"+name+".png";
  });
}
var qs=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
var langFile=(qs==="tr")?"lang_tr.txt":"lang.txt";
var langP=fetch(langFile).then(function(r){return r.ok?r.text():""}).catch(function(){return ""});
Promise.all([Promise.all(TEX.map(loadImg)),langP]).then(function(r){
  src=r[0]; if(r[1])parseLang(r[1]);
  applyLang(); generateNatural(); resize();
});
})();
</script></body></html>

name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['play/**', 'android/**', 'j2me/Blocks.jar', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy the web game into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp -r play/* android/app/src/main/assets/
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Attach APK and JAR to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KeypadCraft.apk
          gh release view v1.0 >/dev/null 2>&1 || gh release create v1.0 --title "KeypadCraft v1.0" --notes "Android APK (debug-signed) and the J2ME jar. Source in the repo."
          gh release upload v1.0 KeypadCraft.apk j2me/Blocks.jar --clobber
